{% extends 'base.html' %}
{% block title %}Batalkan Listing{% endblock %}
{% block content %}
<div class="auth-container">
    <h2>Batalkan Listing</h2>
    <p>Yakin ingin membatalkan listing <strong>{{ listing.title }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Ya, Batalkan</button>
        <a href="{% url 'my_listings' %}" class="btn-secondary">Tidak</a>
    </form>
</div>
{% endblock %}
