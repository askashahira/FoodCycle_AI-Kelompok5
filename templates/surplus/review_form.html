{% extends 'base.html' %}
{% block title %}Beri Review{% endblock %}
{% block content %}
<div class="auth-container">
    <h2>⭐ Beri Review</h2>
    <p>Review untuk <strong>{{ transaction.listing.user.username }}</strong></p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Kirim Review</button>
    </form>
</div>
{% endblock %}
