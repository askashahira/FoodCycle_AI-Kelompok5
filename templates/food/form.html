{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="form-card" style="max-width:700px;">
    <h3 style="font-size:1.05rem; font-weight:700; margin-bottom:20px;">{{ title }}</h3>
    <form method="post">
        {% csrf_token %}
        <div class="form-grid">
            {% for field in form %}
            <div class="form-group {% if forloop.last %}form-span-2{% endif %}">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <span style="color:var(--red-400); font-size:.8rem;">{{ field.errors.0 }}</span>
                {% endif %}
            </div>
            {% endfor %}
            <div class="form-span-2" style="display:flex; gap:12px; justify-content:flex-end; margin-top:8px;">
                <a href="{% url 'food_list' %}" class="action-btn btn-edit" style="padding:10px 20px; font-size:.9rem; text-decoration:none;">Batal</a>
                <button type="submit" class="btn-green">💾 Simpan Bahan Makanan</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
