{% extends 'base.html' %}
{% block title %}Hapus Bahan{% endblock %}
{% block content %}
<div class="auth-container">
    <h2>Hapus Bahan Makanan</h2>
    <p>Yakin ingin menghapus <strong>{{ item.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Ya, Hapus</button>
        <a href="{% url 'food_list' %}" class="btn-secondary">Batal</a>
    </form>
</div>
{% endblock %}
